[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "presenter-mirror-hud"
version = "0.1.0"
description = "An offline-first presentation mirror HUD and browser companion"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1.3,<4",
  "Pillow>=12.3,<13",
  "pygame>=2.6.1,<3",
  "filelock>=3.32.5,<4",
]

[project.optional-dependencies]
camera = ["numpy>=1.24,<3", "opencv-python-headless>=4.10,<5"]
speech = ["vosk==0.3.45", "sounddevice>=0.5.2,<0.6", "numpy>=1.24,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
